name: Release Build

# 发布构建：同时编译 Windows / Android 的 Debug / Release 四个版本
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.profile }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, android]
        profile: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Windows Debug：仅 cargo build 编译 Rust 后端
      - name: Build Windows debug
        if: matrix.platform == 'windows' && matrix.profile == 'debug'
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # Windows Release：tauri build 会执行 beforeBundleCommand(UPX 压缩)
      # 并生成正式安装包；beforeBuildCommand 会自动先构建前端
      - name: Build Windows release (with UPX)
        if: matrix.platform == 'windows' && matrix.profile == 'release'
        run: npx tauri build

      # tauri android build 会内嵌前端 dist，需先构建前端
      - name: Build frontend
        if: matrix.platform == 'android'
        run: npm run build

      - name: Build Android ${{ matrix.profile }}
        if: matrix.platform == 'android'
        shell: pwsh
        run: |
          if ('${{ matrix.profile }}' -eq 'debug') {
            npx tauri android build --debug
          } else {
            npx tauri android build --apk --target aarch64
          }

      # 收集 Windows Debug 的 exe（位于 target/debug）
      - name: Collect Windows debug artifact
        if: matrix.platform == 'windows' && matrix.profile == 'debug'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows/debug | Out-Null
          Copy-Item src-tauri/target/debug/funkin-tools.exe artifacts/windows/debug/funkin-tools-debug.exe

      # 收集 Windows Release 产物：exe 与安装包(msi/nsis)分开放置
      - name: Collect Windows release artifacts (exe & installers)
        if: matrix.platform == 'windows' && matrix.profile == 'release'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows/release/exe, artifacts/windows/release/installers | Out-Null
          Copy-Item src-tauri/target/release/funkin-tools.exe artifacts/windows/release/exe/funkin-tools.exe
          Copy-Item src-tauri/target/release/bundle/msi/*.msi artifacts/windows/release/installers/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe artifacts/windows/release/installers/ -ErrorAction SilentlyContinue

      # 收集 Android APK：递归找出 apk 并展平到简洁目录，去掉 gen/android/app/build/outputs 深层嵌套
      - name: Collect Android APK
        if: matrix.platform == 'android'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/android/${{ matrix.profile }} | Out-Null
          Get-ChildItem src-tauri/gen/android/app/build/outputs/apk -Recurse -Filter *.apk |
            ForEach-Object { Copy-Item $_.FullName ("artifacts/android/${{ matrix.profile }}/" + $_.Name) }

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: funkin-tools-${{ matrix.platform }}-${{ matrix.profile }}
          path: artifacts/
          if-no-files-found: error